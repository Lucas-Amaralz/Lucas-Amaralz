<svg xmlns="http://www.w3.org/2000/svg" width="560" height="56" viewBox="0 0 560 56" role="img" aria-label="Olá, eu sou o Lucas!">
  <defs>
    <clipPath id="digitando">
      <rect x="0" y="0" width="0" height="56">
        <!-- revela o texto aos poucos, como se estivesse sendo digitado -->
        <animate attributeName="width" values="0;400" dur="1.8s" begin="0.3s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>
  <text x="2" y="38" clip-path="url(#digitando)" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#ffb648">Olá, eu sou o Lucas!</text>
  <!-- cursor que acompanha a digitação e depois fica piscando -->
  <rect x="2" y="14" width="3" height="30" fill="#6ff3e0">
    <animate attributeName="x" values="2;398" dur="1.8s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
