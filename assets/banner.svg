<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lucas Nunes Amaral, Analista de Infraestrutura">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset=".6" stop-color="#121735"/>
      <stop offset="1" stop-color="#2b1433"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb648" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb648" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lua" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9d2bc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#d9d2bc" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
      .pisca{animation:p 3.2s ease-in-out infinite}
      .pisca2{animation:p 4.4s ease-in-out infinite .8s}
      .janela{animation:j 5s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes j{0%,100%{opacity:.85}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pisca,.pisca2,.janela{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#ceu)"/>

  <!-- estrelas -->
  <g fill="#ece6d4">
    <circle class="pisca" cx="80" cy="40" r="1.6"/><circle cx="160" cy="90" r="1.2"/><circle class="pisca2" cx="250" cy="30" r="1.4"/>
    <circle cx="340" cy="70" r="1"/><circle class="pisca" cx="430" cy="25" r="1.3"/><circle cx="520" cy="60" r="1.1"/>
    <circle class="pisca2" cx="610" cy="35" r="1.5"/><circle cx="700" cy="80" r="1"/><circle class="pisca" cx="780" cy="22" r="1.2"/>
    <circle cx="1120" cy="40" r="1.3"/><circle class="pisca2" cx="1060" cy="95" r="1"/><circle cx="1170" cy="120" r="1.2"/>
  </g>

  <!-- lua -->
  <circle cx="1090" cy="70" r="60" fill="url(#lua)"/>
  <circle cx="1090" cy="70" r="24" fill="#e2dbc4"/>
  <circle cx="1098" cy="72" r="19" fill="#c4bca4" opacity=".5"/>

  <!-- colinas e torres das maquinas ao fundo -->
  <path d="M0 250 Q150 220 300 240 T600 235 T900 245 T1200 230 V300 H0 Z" fill="#0b0e1c"/>
  <g fill="#090b18">
    <path d="M840 250 L850 175 L860 175 L870 250 Z"/><rect x="846" y="160" width="18" height="16" rx="2"/>
    <path d="M1150 248 L1158 190 L1166 190 L1174 248 Z"/><rect x="1153" y="178" width="16" height="13" rx="2"/>
  </g>
  <rect class="pisca" x="849" y="166" width="12" height="3" fill="#ff3b4e"/>
  <rect class="pisca2" x="1156" y="183" width="10" height="2.5" fill="#ff3b4e"/>

  <!-- a casinha com a ultima luz acesa -->
  <circle class="janela" cx="985" cy="222" r="70" fill="url(#luz)"/>
  <rect x="940" y="205" width="80" height="45" fill="#2b2440"/>
  <path d="M928 207 L980 172 L1032 207 Z" fill="#3e2c4a"/>
  <rect x="999" y="178" width="9" height="20" fill="#2a2036"/>
  <rect x="952" y="222" width="16" height="28" rx="2" fill="#1f1729"/>
  <rect class="janela" x="982" y="214" width="26" height="20" fill="#f0a040"/>
  <rect x="982" y="214" width="26" height="6" fill="#ffc56a"/>
  <rect x="994" y="214" width="2" height="20" fill="#2b2440"/>
  <path d="M0 262 H1200 V300 H0 Z" fill="#0e1716"/>

  <!-- texto -->
  <text class="t" x="70" y="140" font-size="54" font-weight="700" fill="#ece6d4">Lucas Nunes Amaral</text>
  <text class="t" x="72" y="184" font-size="24" font-weight="600" fill="#ffb648">Analista de Infraestrutura · Microsoft e AWS</text>
  <text class="t" x="72" y="220" font-size="18" fill="#9a97b2">Active Directory · Entra ID · Microsoft 365 · Automação · AWS Certified Cloud Practitioner</text>
</svg>
