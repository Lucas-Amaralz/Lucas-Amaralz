# Gera a animação da cobrinha passando pelas contribuições do GitHub.
# Roda todo dia, a cada envio para a main e também pelo botão "Run workflow" (aba Actions).
# O resultado vai para a branch "output", que o README usa como imagem.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 6 * * *"     # todo dia às 6h UTC (3h em Brasília)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6ff3e0&color_dots=#161b22,#3b2a7a,#5b3fd1,#a78bfa,#6ff3e0

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
